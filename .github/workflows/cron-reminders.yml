name: Reminder cron

on:
  schedule:
    # Every 5 minutes — fires the /api/cron/reminders endpoint.
    # Hobby-tier Vercel doesn't allow sub-daily cron, so we drive it from here.
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Hit reminders endpoint
        run: |
          curl -fsS \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/cron/reminders"
